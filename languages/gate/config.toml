name = "Gate"
grammar = "gate"
path_suffixes = ["gate"]
line_comments = ["# ", "## "]
brackets = [
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = true },
  { start = "{", end = "}", close = true, newline = true },
  { start = '"', end = '"', close = true, newline = true },
  { start = "'", end = "'", close = true, newline = true },
]
auto_indent_using_last_non_empty_line = false
increase_indent_pattern = ":\\s*$"
autoclose_before = ":.,}])>"
hard_tabs = true
debuggers = ["godot"]
